name: Automation CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["develop"]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Run Tests
        run: mvn -Dci=true test